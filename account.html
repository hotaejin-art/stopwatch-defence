<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stopwatch Defence — Email verification</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#111;color:#e8e8e8;font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:520px;margin:0 auto;padding:40px 20px 64px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:#9aa;margin:0 0 20px}
a{color:#8ecbff}
label{display:block;font-size:13px;margin:16px 0 6px;color:#cdd6e0}
input{display:block;box-sizing:border-box;width:100%;font:16px monospace;padding:12px;color:#fff;background:#0b1617;border:1px solid #698079;border-radius:6px}
button{display:block;width:100%;min-height:48px;margin-top:16px;padding:12px;font:600 15px -apple-system,sans-serif;background:#24483c;color:#e2f4e9;border:1px solid #80b39c;border-radius:6px}
button:disabled{opacity:.45}
.ok{color:#7be3a2}
.err{color:#ff9d9d}
.hide{display:none}
footer{margin-top:40px;color:#778;font-size:13px;border-top:1px solid #333;padding-top:16px}
</style>
</head>
<body>
<main>
<h1>Stopwatch Defence</h1>
<p class="sub">Account email</p>

<div id="verify" class="hide">
 <p class="ok" id="verify-text">Your email is confirmed.</p>
 <p>You can return to the app and sign in.</p>
</div>

<div id="reset" class="hide">
 <p>This link lets you set a new password for your account.</p>
 <label for="pw">New password (8+ characters)</label>
 <input id="pw" type="password" minlength="8" autocomplete="new-password">
 <label for="pw2">Repeat new password</label>
 <input id="pw2" type="password" minlength="8" autocomplete="new-password">
 <button id="save">SAVE NEW PASSWORD</button>
 <p id="reset-msg" role="status"></p>
</div>

<div id="empty">
 <p>Open this page from the confirmation or password reset link in your email.</p>
</div>

<div id="error" class="hide">
 <p class="err" id="error-text"></p>
</div>

<footer>Stopwatch Defence · <a href="mailto:hotaejin@gmail.com">hotaejin@gmail.com</a> · <a href="index.html">Support</a> · <a href="privacy.html">Privacy Policy</a></footer>
</main>
<script>
const URL_BASE='https://hiwnqvzezolmszzofhou.supabase.co';
const KEY='sb_publishable_Slc0aMaiCv2fPnLY4iSNMA_p5UD3stY';
const params=new URLSearchParams(location.hash.slice(1));
const accessToken=params.get('access_token');
const type=params.get('type');
const errorText=params.get('error_description')||params.get('error');
function show(id){document.querySelectorAll('main > div').forEach(d=>d.classList.add('hide'));document.getElementById(id).classList.remove('hide');}
if(errorText){document.getElementById('error-text').textContent=decodeURIComponent(errorText);show('error');}
else if(accessToken&&type==='recovery'){show('reset');}
else if(accessToken){show('verify');}
else{show('empty');}
document.getElementById('save').onclick=async()=>{
 const msg=document.getElementById('reset-msg');
 const button=document.getElementById('save');
 const pw=document.getElementById('pw').value,pw2=document.getElementById('pw2').value;
 if(pw.length<8){msg.className='err';msg.textContent='Password must be at least 8 characters.';return;}
 if(pw!==pw2){msg.className='err';msg.textContent='Passwords do not match.';return;}
 button.disabled=true;
 try{
  const r=await fetch(URL_BASE+'/auth/v1/user',{method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
  const result=await r.json().catch(()=>null);
  if(!r.ok)throw new Error(result?.msg||result?.message||'Password update failed.');
  msg.className='ok';msg.textContent='Password updated! Return to the app and sign in with your new password.';
 }catch(e){msg.className='err';msg.textContent=e.message;button.disabled=false;}
};
</script>
</body>
</html>
